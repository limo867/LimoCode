<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Coding Agent</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #111827; color: #e5e7eb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111827; }
    header { padding: 22px 5vw 16px; border-bottom: 1px solid #374151; display: flex; justify-content: space-between; align-items: baseline; }
    h1 { margin: 0; font-size: 1.25rem; letter-spacing: 0; }
    .subtle { color: #9ca3af; font-size: .85rem; }
    main { max-width: 1280px; margin: 0 auto; padding: 24px 5vw; display: grid; grid-template-columns: 220px minmax(260px, 360px) 1fr; gap: 18px; }
    section { border: 1px solid #374151; background: #1f2937; border-radius: 8px; padding: 18px; }
    label { display: block; font-size: .82rem; color: #9ca3af; margin: 0 0 8px; }
    textarea { width: 100%; min-height: 150px; resize: vertical; background: #111827; color: #f9fafb; border: 1px solid #4b5563; border-radius: 6px; padding: 12px; font: inherit; }
    .row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
    button { border: 0; border-radius: 6px; padding: 9px 14px; background: #2563eb; color: white; cursor: pointer; font-weight: 600; }
    button.secondary { background: #4b5563; } button:disabled { opacity: .45; cursor: default; }
    .timeline { min-height: 420px; max-height: 65vh; overflow: auto; display: flex; flex-direction: column; gap: 9px; }
    .event { border-left: 3px solid #6b7280; padding: 8px 11px; background: #111827; border-radius: 0 5px 5px 0; white-space: pre-wrap; word-break: break-word; }
    .event.tool_started { border-color: #f59e0b; } .event.tool_finished { border-color: #10b981; }
    .event.task_error { border-color: #ef4444; } .event.assistant_message, .event.task_finished { border-color: #60a5fa; }
    .event strong { display: block; font-size: .82rem; margin-bottom: 4px; }
    .event .meta { color: #9ca3af; font-size: .78rem; } pre { margin: 6px 0 0; white-space: pre-wrap; max-height: 220px; overflow: auto; color: #d1d5db; }
    details { margin-top: 7px; color: #d1d5db; } summary { cursor: pointer; color: #93c5fd; }
    .history { max-height: 65vh; overflow: auto; } .history button { width: 100%; text-align: left; margin-bottom: 7px; background: #374151; font-size: .78rem; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 980px) { main { grid-template-columns: 190px 1fr; } main > section:nth-child(2) { grid-column: 1 / -1; } }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } header { align-items: flex-start; gap: 5px; flex-direction: column; } .history { max-height: 180px; } }
  </style>
</head>
<body>
  <header><h1>Local Coding Agent</h1><span id="status" class="subtle">就绪</span></header>
  <main>
    <section class="history"><label>任务历史</label><div id="history" class="subtle">暂无任务</div></section>
    <section>
      <label for="task">编程任务</label>
      <textarea id="task" placeholder="例如：检查项目测试并修复失败项"></textarea>
      <div class="row"><label><input id="demo" type="checkbox" checked> 离线演示模式</label></div>
      <div class="row"><button id="start">开始任务</button><button id="stop" class="secondary" disabled>停止</button></div>
      <p id="meta" class="subtle"></p>
    </section>
    <section><div id="timeline" class="timeline"><div class="subtle">任务事件会显示在这里。</div></div></section>
  </main>
  <script>
    const task = document.querySelector('#task'), demo = document.querySelector('#demo'), start = document.querySelector('#start'), stop = document.querySelector('#stop'), status = document.querySelector('#status'), meta = document.querySelector('#meta'), timeline = document.querySelector('#timeline');
    let taskId = null, source = null, lastEvent = 0, seen = new Set();
    async function loadHistory() { const response = await fetch('/api/tasks'); if (!response.ok) return; const data = await response.json(); const panel = document.querySelector('#history'); panel.innerHTML = ''; if (!data.tasks.length) { panel.textContent = '暂无任务'; return; } data.tasks.forEach(item => { const button = document.createElement('button'); button.textContent = `${item.status} · ${item.task}`; button.onclick = () => openTask(item.id); panel.appendChild(button); }); }
    async function openTask(id) { taskId = id; lastEvent = 0; seen = new Set(); timeline.innerHTML = ''; status.textContent = '加载中'; const response = await fetch(`/api/tasks/${id}`); const record = await response.json(); meta.textContent = `任务 ${id.slice(0, 8)}`; if (record.status === 'completed') status.textContent = '已完成'; connectEvents(); }
    function connectEvents() { if (source) source.close(); source = new EventSource(`/api/tasks/${taskId}/events?after=${lastEvent}`); source.onmessage = event => { const payload = JSON.parse(event.data); if (seen.has(payload.id)) return; seen.add(payload.id); lastEvent = Math.max(lastEvent, payload.sequence || 0); addEvent(payload); status.textContent = payload.type === 'task_finished' ? '已完成' : payload.type === 'task_error' ? '失败' : payload.type === 'task_cancelled' ? '已停止' : '运行中'; if (['task_finished','task_error','task_cancelled'].includes(payload.type)) finish(); }; source.onerror = () => { if (source && source.readyState === EventSource.CLOSED && taskId) setTimeout(connectEvents, 1000); }; }
    function appendText(parent, value) { const pre = document.createElement('pre'); pre.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2); parent.appendChild(pre); }
    function addEvent(event) {
      if (timeline.querySelector('.subtle')) timeline.innerHTML = '';
      const item = document.createElement('div'); item.className = `event ${event.type}`;
      const data = event.data || {}; const title = document.createElement('strong');
      title.textContent = event.type === 'tool_started' ? `Running ${data.tool}` : event.type === 'tool_finished' ? `${data.tool} ${data.result && data.result.ok ? 'completed' : 'failed'}` : event.type.replaceAll('_', ' ');
      item.appendChild(title);
      const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = `Event ${event.sequence || '?'} · ${new Date(event.timestamp).toLocaleTimeString()}`; item.appendChild(meta);
      if (event.type === 'tool_started') appendText(item, data.arguments || {});
      else if (event.type === 'tool_finished') {
        const result = data.result || {}; const summary = document.createElement('div'); summary.className = 'meta'; summary.textContent = result.error || (result.path ? `Path: ${result.path}` : result.returncode !== undefined ? `Exit code: ${result.returncode}` : 'Completed'); item.appendChild(summary);
        if (result.output || result.content) { const details = document.createElement('details'); const label = document.createElement('summary'); label.textContent = result.output ? 'Command output' : 'File content'; details.appendChild(label); appendText(details, result.output || result.content); item.appendChild(details); }
        if (result.content_preview !== undefined) { const details = document.createElement('details'); const label = document.createElement('summary'); label.textContent = result.changed ? 'File change preview' : 'File unchanged'; details.appendChild(label); const before = document.createElement('div'); before.className = 'meta'; before.textContent = 'Before'; details.appendChild(before); appendText(details, result.previous_preview || '(new file)'); const after = document.createElement('div'); after.className = 'meta'; after.textContent = 'After'; details.appendChild(after); appendText(details, result.content_preview); item.appendChild(details); }
      } else if (event.type === 'assistant_message' || event.type === 'task_finished' || event.type === 'task_error') appendText(item, data.content || data.result || data.error || data);
      timeline.appendChild(item); timeline.scrollTop = timeline.scrollHeight;
    }
    function finish() { start.disabled = false; stop.disabled = true; if (source) source.close(); source = null; }
    start.onclick = async () => {
      if (!task.value.trim()) return;
      timeline.innerHTML = ''; status.textContent = '创建任务中'; start.disabled = true;
      try {
        const response = await fetch('/api/tasks', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({task: task.value, demo: demo.checked}) });
        const record = await response.json(); if (!response.ok) throw new Error(record.error || '创建失败');
        taskId = record.id; meta.textContent = `任务 ${taskId.slice(0, 8)}`; status.textContent = '运行中'; stop.disabled = false;
        connectEvents(); loadHistory();
      } catch (error) { status.textContent = error.message; finish(); }
    };
    stop.onclick = async () => { if (taskId) await fetch(`/api/tasks/${taskId}`, {method: 'DELETE'}); status.textContent = '正在停止'; stop.disabled = true; };
    loadHistory();
  </script>
</body>
</html>
